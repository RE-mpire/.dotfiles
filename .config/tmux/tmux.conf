set -s escape-time 5                  # Escape key delay (ms)
set -g history-limit 50000            # Scrollback limit
set -sg terminal-overrides ",*:RGB"   # Enable RGB colors
set -g default-terminal "screen-256color:RGB"
set -g focus-events on                # Enable focus events
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on     # Renumber windows on close

# New panes open in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
